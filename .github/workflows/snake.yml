name: Generate snake

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#e12885&color_dots=#ebedf0,#b8ede8,#7fd9d0,#4fc9bd,#2a9d93
            dist/snake-dark.svg?color_snake=#e12885&color_dots=#161b22,#0e4c47,#1a7a72,#2aa198,#39c5bb

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
